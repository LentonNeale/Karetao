# What tools/stack_depth.py cannot read from the call graph.
#
# indirect <caller>[,<caller>...] <sites> <target>...
#     The function-pointer calls in these callers may reach these targets; `none`
#     records that the pointer is never set in this firmware. <sites> is the exact
#     number of function-pointer call sites the callers hold together: a new or
#     removed call changes it and fails the check until the entry is reviewed.
#     List every caller the call can be inlined into (Release, -Os), so the count
#     holds in both builds.
# external <function> <bytes>
#     Stack used by a library function built without -fcallgraph-info.

# Snapshot staging: the serializers passed to SnapshotBuilder_Stage (spi_slave_service.c).
indirect SnapshotBuilder_Stage 1 SpiSlaveService_SerializeResponse SpiSlaveService_SerializeLatestSnapshot

# Time base: the counter reader TimeService_Init registers (time_service.c).
indirect TimeService_StateNowUs 1 TimeService_ReadTim2

# Timer task (timers.c): software-timer callbacks and pended function calls. No software
# timer is created and no call is pended: nothing calls osTimerNew, xTimerCreate,
# xTimerPendFunctionCall, or osEventFlagsSet/Clear from an interrupt. Release inlines
# prvSwitchTimerLists into prvSampleTimeNow.
indirect prvProcessExpiredTimer,prvProcessReceivedCommands,prvSwitchTimerLists,prvSampleTimeNow,prvTimerTask 4 none

# newlib-nano (arm-none-eabi-gcc 13.2.1), read from the firmware disassembly: memcpy pushes
# nothing; memmove pushes {r4, r5, r6, lr}; memset {r4, r5, lr}; strlen {r4, r5}; none calls out.
external memcpy 0
external memmove 16
external memset 12
external strlen 8
