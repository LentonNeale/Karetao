name: arm-ci

on:
  pull_request:
    paths:
      - 'Arm_Sensor_Hub/**'
      - 'shared/**'
      - '.github/workflows/arm-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'Arm_Sensor_Hub/**'
      - 'shared/**'
      - '.github/workflows/arm-ci.yml'

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Arm_Sensor_Hub
    steps:
      - uses: actions/checkout@v4
      - name: Configure HostTests
        run: cmake --preset HostTests
      - name: Build HostTests
        run: cmake --build --preset HostTests
      - name: Run HostTests
        run: ctest --preset HostTests --output-on-failure
