# ICM Portal settings for Karetao.
# Start the Portal from the Karetao_Consulting repo:
#   cd ~/Git_repos/Karetao_Consulting && .venv/bin/python -m icm_portal --project ~/Git_repos/Karetao
# Full list of keys and defaults: Karetao_Consulting/portal/icm_portal/config.py and portal/README.md.

# Run data (briefs, plans, designs, chats, logs) and the checklist stay outside this repo.
runs_dir = "~/icm-portal/data/karetao/runs"
checklist_file = "~/icm-portal/data/karetao/checklist.md"
context_soft_limit = 60000

[git]
worktrees_dir = "~/icm-portal/worktrees/karetao"   # builds happen here, never in this working copy

[methodology]
default = "agile"   # charter alignment plan runs as agile sprints (Backlog, Sprint plan, Design, Build, Retro)

[commands]
# What a Build's Verify runs, from the build worktree's root. These mirror CI and the project's
# definition of done (a firmware change is done when the Debug build passes).
verify = [
    "sh -c 'cd Arm_Sensor_Hub && cmake --preset HostTests && cmake --build --preset HostTests && ctest --preset HostTests --output-on-failure'",
    "sh -c 'cd Arm_Sensor_Hub && cmake --preset Debug && cmake --build --preset Debug'",
    "python3 -m unittest discover -s RaspberryPi_Sensor_Hub/tests/spi -p test_*.py",
    "python3 icm-project/tools/doc_check/doc_check.py",
]
verify_timeout = 900
# What an implement step may run by itself (prefix match).
allowed = [
    "cmake --preset *",
    "cmake --build *",
    "ctest *",
    "python3 -m unittest *",
]

[codemap]
# Vendor code: CubeMX HAL/CMSIS drivers and the FreeRTOS kernel are large and never edited here.
exclude = ["Arm_Sensor_Hub/Drivers/", "Arm_Sensor_Hub/Middlewares/Third_Party/FreeRTOS/", "Arm_Sensor_Hub/build/"]

# Karetao's own ICM items (project facts) live in icm-project/; generic ones come from the Portal.
[manage]
workspaces = "icm-project/workspaces"
tools = "icm-project/tools"
skills = "icm-project/skills"
references = "icm-project/references"
templates = "~/Git_repos/Karetao_Consulting/icm/_core/templates"

# The Portal's shared workspaces. Copy one into icm-project/workspaces/ and point here to customise it.
[liaison]
workspace = "~/Git_repos/Karetao_Consulting/icm/workspaces/client-liaison"

[review]
workspace = "~/Git_repos/Karetao_Consulting/icm/workspaces/request-review"

[build]
workspace = "icm-project/workspaces/implement-step"   # Karetao copy: adds reference rows
test_workspace = "~/Git_repos/Karetao_Consulting/icm/workspaces/test-changes"

[pre_merge_review]
workspace = "icm-project/workspaces/pre-merge-review"   # Karetao copy: adds reference rows
