# ICM Portal settings for Karetao.
# Start the Portal from the Karetao_Consulting repo:
#   cd ~/Git_repos/Karetao_Consulting && .venv/bin/python -m icm_portal --project ~/Git_repos/Karetao
# Full list of keys and defaults: Karetao_Consulting/portal/icm_portal/config.py and portal/README.md.

# Run data (briefs, plans, designs, chats, logs) and the checklist stay outside this repo.
runs_dir = "~/icm-portal/data/karetao/runs"
checklist_file = "~/icm-portal/data/karetao/checklist.md"
context_soft_limit = 60000

[git]
worktrees_dir = "~/icm-portal/worktrees/karetao"   # builds happen here, never in this working copy

[methodology]
default = "agile"   # charter alignment plan runs as agile sprints (Backlog, Sprint plan, Design, Build, Retro)

# Work packages above the runs (Project tab: Work, Lifecycle, Map). The profile's Requirements gate is the
# charter-alignment sign-off (CHARTER_ALIGNMENT_PLAN.md section 3); a PASS there tags baseline/requirements/v1.
[lifecycle]
profile = "mechatronics"   # Intake, Requirements*, Architecture*, Design, Implementation, Bring-up, Verification*, Validation, Release* (* = gate)
file = "lifecycle.json"

# The project files each baseline covers; a gate's files_committed check and the Baselines list use them.
[lifecycle.files]
requirements = [
    "Documentation/01_SYSTEM/PROJECT_CHARTER.md",
    "Documentation/01_SYSTEM/SYSTEM_REQUIREMENTS.md",
    "Documentation/04_SAFETY/SAFETY_REQUIREMENTS.md",
    "Documentation/06_CONFIGURATION/PARAMETER_REGISTER.md",
]
architecture = [
    "Documentation/01_SYSTEM/SYSTEM_ARCHITECTURE.md",
    "Documentation/02_INTERFACES/SPI/SPI_SYSTEM_INTERFACE.md",
    "Documentation/02_INTERFACES/SPI/SPI_PAYLOAD_SCHEMA.md",
    "Documentation/02_INTERFACES/CAN/CAN_SYSTEM_INTERFACE.md",
    "Documentation/02_INTERFACES/TIME/TIME_SYSTEM_INTERFACE.md",
    "Documentation/02_INTERFACES/HOST/HOST_SYSTEM_INTERFACE.md",
]

[commands]
# What a Build's Verify runs, from the build worktree's root. These mirror CI and the project's
# definition of done (a firmware change is done when the Debug build passes).
# Each firmware and Pi command carries the same path filter as its CI workflow, so a change that
# touches neither (a documentation review, say) records it as not applicable rather than PASS.
verify = [
    { run = "sh -c 'cd Arm_Sensor_Hub && cmake --preset HostTests && cmake --build --preset HostTests && ctest --preset HostTests --output-on-failure'", paths = ["Arm_Sensor_Hub/**", "shared/**"] },
    { run = "sh -c 'cd Arm_Sensor_Hub && cmake --preset Debug && cmake --build --preset Debug'", paths = ["Arm_Sensor_Hub/**", "shared/**"] },
    { run = "python3 -m unittest discover -s RaspberryPi_Sensor_Hub/tests/spi -p test_*.py", paths = ["RaspberryPi_Sensor_Hub/**", "shared/**"] },
    "python3 icm-project/tools/doc_check/doc_check.py",
]
verify_timeout = 900
# What an implement step may run by itself (prefix match).
allowed = [
    "cmake --preset *",
    "cmake --build *",
    "ctest *",
    "python3 -m unittest *",
    # Documentation work: the check tool, line counts, term scans and history (read-only).
    "python3 icm-project/tools/doc_check/doc_check.py*",
    "wc *",
    "grep *",
    "git log *",
    "git diff *",
    # Read a run's JSON record (design.json, state.json) without python -c.
    "jq *",
]

[codemap]
# Vendor code: CubeMX HAL/CMSIS drivers and the FreeRTOS kernel are large and never edited here.
exclude = ["Arm_Sensor_Hub/Drivers/", "Arm_Sensor_Hub/Middlewares/Third_Party/FreeRTOS/", "Arm_Sensor_Hub/build/"]

# Karetao's own ICM items (project facts) live in icm-project/; generic ones come from the Portal.
[manage]
workspaces = "icm-project/workspaces"
tools = "icm-project/tools"
skills = "icm-project/skills"
references = "icm-project/references"
templates = "~/Git_repos/Karetao_Consulting/icm/_core/templates"

# The Portal's shared workspaces. Copy one into icm-project/workspaces/ and point here to customise it.
[liaison]
workspace = "~/Git_repos/Karetao_Consulting/icm/workspaces/client-liaison"

[review]
workspace = "~/Git_repos/Karetao_Consulting/icm/workspaces/request-review"

[build]
workspace = "icm-project/workspaces/implement-step"   # Karetao copy: adds reference rows
test_workspace = "~/Git_repos/Karetao_Consulting/icm/workspaces/test-changes"

[pre_merge_review]
workspace = "icm-project/workspaces/pre-merge-review"   # Karetao copy: adds reference rows
